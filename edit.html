{% extends "base.html" %}{% block title %}FreshMart | Edit{% endblock %}{% block heading %}Edit Product{% endblock %}{% block content %}
<div class="pageintro"><div><h2>Update product details</h2><p>Changes are saved to your inventory.</p></div><a class="btn pale" href="/inventory">← Back to inventory</a></div><section class="panel"><form method="post" class="formgrid"><label>Product name<input name="name" value="{{product.name}}" required></label><label>Category<input name="category" value="{{product.category}}" required></label><label>Price (₹)<input name="price" type="number" min="0" step=".01" value="{{product.price}}" required></label><label>Quantity<input name="quantity" type="number" min="0" value="{{product.quantity}}" required></label><div class="formactions"><button class="btn">Save changes</button></div></form></section>{% endblock %}
